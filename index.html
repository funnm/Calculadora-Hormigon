    <script>
      (function () {
        try {
          var saved = localStorage.getItem('concrete-dark-mode');
          if (saved === 'true') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      #preloader {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background-color: #f5f5f7;
        color: #111113;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      html.dark #preloader {
        background-color: #09090b;
        color: #f5f5f7;
      }
      #preloader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-mark {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: #111113;
        color: #ffffff;
        display: grid;
        place-items: center;
        font-family: ui-monospace, monospace;
        font-size: 26px;
        font-weight: 900;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.16);
      }
      html.dark .preloader-mark {
        background: #f5f5f7;
        color: #111113;
      }
      .preloader-title {
        margin: 10px 0 0;
        font-size: 1.05rem;
        font-weight: 800;
      }
      .preloader-sub {
        margin: 4px 0 0;
        font-size: 0.78rem;
        opacity: 0.65;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="preloader-mark">H</div>
      <p class="preloader-title">Calculadora de Hormigón</p>
      <p class="preloader-sub">Engineering Suite Pro · Paul R</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
