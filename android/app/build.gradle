plugins {
    id 'com.android.application'
}

android {
    namespace 'com.calculadorahormigon.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.calculadorahormigon.app"
        minSdk 24
        targetSdk 33
        versionCode 20000
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
